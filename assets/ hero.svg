<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Custom GitHub profile graphic">
 <defs>
 <linearGradient id="back-h" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071117"/><stop offset="1" stop-color="#12272B"/></linearGradient>
 <linearGradient id="mint-h" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#76F7D5"/><stop offset="1" stop-color="#79C9FA"/></linearGradient>
 <linearGradient id="scan-h" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#76F7D5" stop-opacity="0"/><stop offset="0.5" stop-color="#76F7D5" stop-opacity="0.24"/><stop offset="1" stop-color="#76F7D5" stop-opacity="0"/></linearGradient>
 <filter id="glow-h" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid-h" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#76F7D5" stroke-opacity=".055" stroke-width="1"/></pattern>
 </defs>
 <style>
  .mono {font-family:'DejaVu Sans Mono','Courier New',monospace}
  .sans {font-family:Inter,'DejaVu Sans',Arial,sans-serif}
  .scanning {animation: scan 5s ease-in-out infinite}
  .cursor {animation: blink 1.1s steps(1,end) infinite}
  .orbit {transform-origin: center; animation: rotate 22s linear infinite}
  .pulse {animation: pulse 3s ease-in-out infinite}
  @keyframes scan {0% {transform:translateY(-130px);opacity:0} 12% {opacity:1} 88% {opacity:1} 100% {transform:translateY(450px);opacity:0}}
  @keyframes blink {50% {opacity:0}}
  @keyframes rotate {to {transform:rotate(360deg)}}
  @keyframes pulse {50% {opacity:.35}}
  @media (prefers-reduced-motion:reduce) {.scanning,.cursor,.orbit,.pulse {animation:none}}
 </style>
